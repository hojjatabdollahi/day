[package]
name = "day"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"

[profile.release]
lto = "thin"
opt-level = 3

[dependencies]
cosmic-config = { git = "https://github.com/pop-os/libcosmic" }
serde = { version = "1.0", features = ["derive"] }
jiff = "0.2"
i18n-embed-fl = "0.10"
i18n-embed = { version = "0.16.0", features = [
  "fluent-system",
  "desktop-requester",
] }
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
  "applet",
  "applet-token",
  "dbus-config",
  "multi-window",
  "tokio",
  "wayland",
  "desktop-systemd-scope",
  "winit",
] }
rust-embed = "8.11.0"
tokio = { version = "1", features = ["full"] }
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
icu = { version = "2.1.1", features = ["compiled_data"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }
timedate1-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings" }
cosmic-login1-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings" }
serde_json = "1"
